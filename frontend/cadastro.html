<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docisis - Cadastro de Operador</title>

    <!-- Bootstrap 5 CSS + Bootstrap Icons + Global Docisis CSS + Cadastro CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/cadastro.css">
</head>

<body>
    <div class="container py-4 my-auto">
        <!-- Logo e Cabeçalho do Sistema -->
        <div class="text-center mb-4">
            <div class="brand-logo-wrapper mb-2">
                <img src="src/assets/logo-docisis.svg" alt="Docisis" class="img-fluid" style="max-height: 65px;">
            </div>
            <p class="brand-subtitle mt-1">Gestão Profissional de Confeitaria</p>
        </div>

        <!-- Tela de Acesso Negado (Exibida caso o usuário não seja Admin) -->
        <div id="acesso-negado" class="row justify-content-center escondido">
            <div class="col-md-6 col-lg-5">
                <div class="docisis-card text-center p-4">
                    <i class="bi bi-shield-slash text-danger display-4 d-block mb-3"></i>
                    <h2 class="h5 fw-bold text-danger mb-2">Acesso Restrito ao Administrador</h2>
                    <p class="text-muted small mb-4">
                        A inclusão de novos operadores é permitida apenas para contas com nível de acesso <strong>Administrador</strong>.
                    </p>
                    <a href="login.html" class="btn btn-docisis-navy">Retornar ao Login</a>
                </div>
            </div>
        </div>

        <!-- Formulário Principal de Cadastro -->
        <div id="area-cadastro" class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="docisis-card">
                    <!-- Alerta Feedback de Cadastro -->
                    <div id="aviso-cadastro" class="alert d-none mb-3" role="alert"></div>

                    <form id="formulario-cadastro" novalidate>
                        <!-- Nome Completo -->
                        <div class="mb-3">
                            <label for="nome" class="form-label-uppercase">Nome Completo</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-person input-icon"></i>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome do membro" required>
                            </div>
                        </div>

                        <!-- E-mail Corporativo -->
                        <div class="mb-3">
                            <label for="email" class="form-label-uppercase">E-mail Corporativo</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-envelope input-icon"></i>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nome@docisis.com.br" required>
                            </div>
                        </div>

                        <!-- CPF -->
                        <div class="mb-3">
                            <label for="cpf" class="form-label-uppercase">CPF</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-card-heading input-icon"></i>
                                <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                            </div>
                        </div>

                        <!-- Telefone -->
                        <div class="mb-3">
                            <label for="telefone" class="form-label-uppercase">Telefone</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-telephone input-icon"></i>
                                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                            </div>
                        </div>

                        <!-- Senha Inicial -->
                        <div class="mb-3">
                            <label for="senha" class="form-label-uppercase">Senha Inicial</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-lock input-icon"></i>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <!-- Nível de Acesso -->
                        <div class="mb-4">
                            <label for="nivelAcesso" class="form-label-uppercase">Nível de Acesso</label>
                            <div class="input-group-docisis">
                                <i class="bi bi-shield-lock input-icon"></i>
                                <select class="form-select" id="nivelAcesso" name="nivelAcesso" required>
                                    <option value="" selected disabled>Selecione a permissão...</option>
                                    <option value="OPERADOR">Estagiário / Operador</option>
                                    <option value="LIDER">Líder de Equipe</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                            </div>
                        </div>

                        <!-- Resumo da Permissão Selecionada -->
                        <div id="painel-info-permissao" class="p-3 mb-4 rounded bg-light border border-warning-subtle d-none">
                            <small id="texto-permissao" class="d-block text-muted small mb-0"></small>
                        </div>

                        <!-- Botão de Envio (Dark Navy) -->
                        <button type="submit" id="btn-cadastrar" class="btn btn-docisis-navy">
                            Cadastrar Operador <i class="bi bi-arrow-right-short fs-5"></i>
                        </button>
                    </form>
                </div>

                <!-- Rodapé de Suporte Técnico -->
                <div class="support-footer">
                    <i class="bi bi-headset fs-6"></i>
                    <span>Suporte Técnico Administrativo</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Cadastro e Proteção de Rota -->
    <script src="src/js/cadastro.js"></script>
</body>

</html>
